<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630, initial-scale=1.0">
    <title>OGP Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans JP', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a2c4e 0%, #0a0a0a 70%);
            z-index: 1;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 2;
        }

        .content {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2ff, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 42px;
            color: #e0e0e0;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 40px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .loss-text {
            font-size: 32px;
            color: #ff4d4d;
            margin-top: 40px;
            font-weight: bold;
        }
        
        .accent-circle {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            border: 1px solid rgba(0, 242, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid"></div>
    <div class="accent-circle"></div>
    
    <div class="content">
        <div class="logo-text">Life Audit System</div>
        <div class="subtitle">あなたの「先延ばし」損失額を診断</div>
        <div class="loss-text">⚠️ 生涯損失: 1億円超えのリスクあり</div>
    </div>
</body>
</html>
